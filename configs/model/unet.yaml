model:
  in_channels: 1
  out_channels: 1
  down_block_types: 
    - DownBlock2D
    - DownBlock2D
    - CrossAttnDownBlock2D
    - DownBlock2D  # CrossAttnDownBlock2D
  up_block_types:
    - UpBlock2D  # CrossAttnUpBlock2D
    - CrossAttnUpBlock2D
    - UpBlock2D
    - UpBlock2D
  block_out_channels: [64, 128, 256, 320]  # [64, 128, 256, 512]
  layers_per_block: 2
  attention_head_dim: 8  # 16, 8
  cross_attention_dim: 64  # 128

scheduler:
  type: DDPM  # DDPM, DDIM
  num_train_timesteps: 500
  num_inference_steps: 50  # 50, 15
  beta_schedule: squaredcos_cap_v2
  prediction_type: epsilon # epsilon, v_prediction
  clip_sample: false

conditioner:
  embed_dim: 64  # 128
  dropout: 0.1  # 0.0
